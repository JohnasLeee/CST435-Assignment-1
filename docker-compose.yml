services:
  backtester:
    build:
      context: .
      dockerfile: alpha.Dockerfile
    container_name: backtester
    working_dir: /app
    environment:
      - ALPHA_HOST=alpha
      - ALPHA_PORT=50050
      - BACKTESTER_PORT=50052
      - PNL_OUTPUT_DIR=/outputs
    ports:
      - "50052:50052"
    volumes:
      - ./outputs:/outputs
    command: ["python", "backtester_service.py"]

  normalizer:
    build:
      context: .
      dockerfile: Dockerfile
    image: normalizer_service
    container_name: normalizer
    environment:
      - NORMALIZER_PORT=50051
    ports:
      - "50051:50051"

  alpha:
    build:
      context: .
      dockerfile: alpha.Dockerfile
    container_name: alpha
    working_dir: /app
    environment:
      - NORMALIZER_HOST=normalizer
      - NORMALIZER_PORT=50051
      - BACKTESTER_HOST=backtester
      - BACKTESTER_PORT=50052
      - ALPHA_PORT=50050
    ports:
      - "50050:50050"
    command: ["python", "alpha_service.py"]
    depends_on:
      - normalizer
    restart: unless-stopped

  master:
    build:
      context: .
      dockerfile: master.Dockerfile
    container_name: master
    working_dir: /app
    environment:
      - ALPHA_HOST=alpha
      - ALPHA_PORT=50050
      - BACKTESTER_HOST=backtester
      - BACKTESTER_PORT=50052
    command: ["python", "master.py"]

networks:
  default:
    name: cst435_net

