services:
  backtester:
    build:
      context: .
      dockerfile: alpha.Dockerfile
    container_name: backtester
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      - ALPHA_HOST=alpha
      - ALPHA_PORT=8081
      - BACKTESTER_PORT=8082
      - MASTER_HOST=master
      - MASTER_PORT=8083
    ports:
      - "8082:8082"
    command: ["python", "backtester_service.py"]

  normalizer:
    build:
      context: .
      dockerfile: Dockerfile
    image: normalizer_service
    container_name: normalizer
    environment:
      - LOG_DEBUG=1
      - NORMALIZER_PORT=8080
      - BACKTESTER_HOST=backtester
      - BACKTESTER_PORT=8082
    ports:
      - "8080:8080"

  alpha:
    build:
      context: .
      dockerfile: alpha.Dockerfile
    container_name: alpha
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      - NORMALIZER_HOST=normalizer
      - NORMALIZER_PORT=8080
      - ALPHA_PORT=8081
    ports:
      - "8081:8081"
    command: ["python", "alpha_service.py"]
    depends_on:
      - normalizer
    restart: unless-stopped

  master:
    build:
      context: .
      dockerfile: master.Dockerfile
    container_name: master
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      - ALPHA_HOST=alpha
      - ALPHA_PORT=8081
      - MASTER_PORT=8083
    ports:
      - "8083:8083"
    command: ["python", "master.py"]

networks:
  default:
    name: cst435_net

